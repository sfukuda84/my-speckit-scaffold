[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "new-speckit-project"
version = "0.1.0"
description = "my-speckit-scaffold から新規プロジェクトを作成し、AI エージェントで立ち上げ（speckit-bootstrap）を始めるコマンド"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
new-speckit-project = "new_speckit_project.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/new_speckit_project"]
