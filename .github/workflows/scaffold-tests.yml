# scaffold 自体のテスト（new-speckit-project は、このファイルを新規プロジェクトに持ち込まない）
name: scaffold-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install python-pptx PyYAML
      - name: Configure git
        run: |
          git config --global user.name "scaffold-tests"
          git config --global user.email "scaffold-tests@users.noreply.github.com"
      - name: Run tests
        working-directory: tool
        run: python -m unittest discover -s tests -v
